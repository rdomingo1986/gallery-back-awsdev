AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  DemoBedRockPY

  Sample SAM Template for DemoBedRockPY

Globals:
  Function:
    Timeout: 3
    Architectures:
      - x86_64
    Runtime: python3.13
    Layers:
      - !Ref DependenciesLayer
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON

Resources:
  ImagesBucket:
    Type: AWS::S3::Bucket

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: dependencies-layer
      Description: Dependencies for Lambda functions
      ContentUri: layers/dependencies/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  RegisterImageMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/register_image_metadata/
      Handler: app.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref ImageMetadataTable
      Policies:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageMetadataTable
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Ref ImagesBucket
            Events: s3:ObjectCreated:*

  ImageMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
        - AttributeName: ImageId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH
        - AttributeName: ImageId
          KeyType: RANGE