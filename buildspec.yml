version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - pip install --upgrade pip
      - pip install aws-sam-cli
  pre_build:
    commands:
      - sam build --use-container
  build:
    commands:
      - sam package --s3-bucket codepipeline-us-west-2-191184544132 --output-template-file packaged.yaml
artifacts:
  files:
    - packaged.yaml